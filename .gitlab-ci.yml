# CI: merge request в main + push в main.
# Подробности: CI_CD.md (корень репозитория)

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

default:
  image: golang:1.23-bookworm

variables:
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

cache:
  key:
    files:
      - go-init-common/go.sum
      - go-init-manager/go.sum
      - go-init-generator/go.sum
      - go-init-publisher/go.sum
  paths:
    - .go/pkg/mod
    - .cache/go-build

.build-env:
  before_script:
    - go version
    - mkdir -p "$GOPATH" "$GOCACHE"

build:
  stage: build
  extends:
    - .build-env
  script:
    - cd go-init-common && go build ./...
    - cd "$CI_PROJECT_DIR/go-init-manager" && go build -o /dev/null ./cmd
    - cd "$CI_PROJECT_DIR/go-init-generator" && go build ./...
    - cd "$CI_PROJECT_DIR/go-init-publisher" && go build ./...

lint:
  stage: lint
  extends:
    - .build-env
  before_script:
    - go version
    - mkdir -p "$GOPATH" "$GOCACHE"
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v1.64.8
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - golangci-lint version
  script:
    - set -e
    - for d in go-init-common go-init-manager go-init-generator go-init-publisher; do echo "=== lint $d ==="; (cd "$d" && golangci-lint run ./...); done

test:
  stage: test
  extends:
    - .build-env
  script:
    - set -e
    - for d in go-init-common go-init-manager go-init-generator go-init-publisher; do echo "=== test $d ==="; (cd "$d" && go test ./... -count=1 -short); done
