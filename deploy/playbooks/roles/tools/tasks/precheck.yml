---
- name: Check kubectl
  ansible.builtin.command: kubectl version --client
  register: kubectl_installed
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ bin_dir }}:{{ ansible_env.PATH }}"

- name: Check k3d
  ansible.builtin.command: k3d version
  register: k3d_installed
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ bin_dir }}:{{ ansible_env.PATH }}"
