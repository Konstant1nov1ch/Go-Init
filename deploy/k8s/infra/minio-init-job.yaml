apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-bucket
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z go-init-minio 9000; do echo waiting for minio; sleep 3; done
      containers:
        - name: init-bucket
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: go-init-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: go-init-secrets
                  key: MINIO_ROOT_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://go-init-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/go-init-archives
              mc anonymous set download local/go-init-archives
              mc ilm rule add --expire-days 1 local/go-init-archives || true
