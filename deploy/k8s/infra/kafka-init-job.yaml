apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z go-init-kafka 29092; do echo waiting for kafka; sleep 3; done
      containers:
        - name: init-topics
          image: confluentinc/cp-kafka:5.5.0
          command:
            - bash
            - -c
            - |
              cub kafka-ready -b go-init-kafka:29092 1 300
              kafka-topics --create --topic go-init-processing --partitions 16 --replication-factor 1 --bootstrap-server go-init-kafka:29092 || true
              kafka-topics --create --topic go-init-done --partitions 16 --replication-factor 1 --bootstrap-server go-init-kafka:29092 || true
