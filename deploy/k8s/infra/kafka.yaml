apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-init-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-init-kafka
  template:
    metadata:
      labels:
        app: go-init-kafka
    spec:
      # Service name "kafka" injects KAFKA_* env vars and breaks cp-kafka.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:5.5.0
          ports:
            - containerPort: 29092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:29092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://go-init-kafka:29092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
          readinessProbe:
            tcpSocket:
              port: 29092
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: go-init-kafka
spec:
  selector:
    app: go-init-kafka
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
