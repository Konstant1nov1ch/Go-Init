apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-init-generator
spec:
  replicas: 4
  selector:
    matchLabels:
      app: go-init-generator
  template:
    metadata:
      labels:
        app: go-init-generator
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z go-init-kafka 29092; do sleep 2; done"]
        - name: wait-publisher
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z go-init-publisher 60024; do sleep 2; done"]
      containers:
        - name: generator
          image: go-init/generator:local
          imagePullPolicy: IfNotPresent
          command: ["/service/service", "--config", "/service/config.yml"]
          volumeMounts:
            - name: config
              mountPath: /service/config.yml
              subPath: config.yml
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: generator-config
---
apiVersion: v1
kind: Service
metadata:
  name: go-init-generator
spec:
  clusterIP: None
  selector:
    app: go-init-generator
  ports:
    - port: 8080
      targetPort: 8080
