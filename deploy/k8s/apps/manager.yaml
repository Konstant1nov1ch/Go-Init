apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-init-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-init-manager
  template:
    metadata:
      labels:
        app: go-init-manager
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z go-init-kafka 29092; do sleep 2; done"]
      containers:
        - name: manager
          image: go-init/manager:local
          imagePullPolicy: IfNotPresent
          command: ["/service/service", "--config", "/service/config.yml"]
          ports:
            - containerPort: 60013
            - containerPort: 60014
          volumeMounts:
            - name: config
              mountPath: /service/config.yml
              subPath: config.yml
          readinessProbe:
            tcpSocket:
              port: 60013
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: manager-config
---
apiVersion: v1
kind: Service
metadata:
  name: go-init-manager
spec:
  type: LoadBalancer
  selector:
    app: go-init-manager
  ports:
    - name: http
      port: 60013
      targetPort: 60013
    - name: grpc
      port: 60014
      targetPort: 60014
