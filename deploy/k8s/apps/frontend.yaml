apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-init-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-init-frontend
  template:
    metadata:
      labels:
        app: go-init-frontend
    spec:
      initContainers:
        - name: wait-manager
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z go-init-manager 60013; do sleep 2; done"]
      containers:
        - name: frontend
          image: go-init/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: NODE_ENV
              value: development
            - name: DOCKER_ENV
              value: "true"
            - name: VITE_API_URL
              value: http://go-init-manager:60013/graphql
          readinessProbe:
            tcpSocket:
              port: 5173
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: go-init-frontend
spec:
  type: LoadBalancer
  selector:
    app: go-init-frontend
  ports:
    - port: 5173
      targetPort: 5173
